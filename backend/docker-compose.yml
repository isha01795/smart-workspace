version: "3.9"

services:

  db:

    image: postgres:15

    container_name: smartworkspace-db

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: smartworkspace

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  api:

    build: .

    container_name: smartworkspace-api

    restart: always

    depends_on:
      - db

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - .:/app

    command: >
      sh -c "
      alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "


volumes:
  postgres_data: